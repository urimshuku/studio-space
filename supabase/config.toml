# Supabase CLI — https://supabase.com/docs/guides/cli/config
# Approve link is opened from email and POSTs without a JWT; disable JWT gate.

[functions.approve-booking]
verify_jwt = false

[functions.unsubscribe-user]
verify_jwt = false

[functions.email-preferences]
verify_jwt = false

[functions.track-open]
verify_jwt = false

[functions.track-click]
verify_jwt = false

[functions.newsletter-signup]
verify_jwt = false

# Paysera server callback has no Supabase JWT
[functions.paysera-callback]
verify_jwt = false

# Ko-fi server webhook has no Supabase JWT
[functions.kofi-webhook]
verify_jwt = false

# Login happens before a user JWT exists. The function checks the username
# and asks Supabase Auth to check the password.
[functions.admin-login]
verify_jwt = false
